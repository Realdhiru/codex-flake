name: Update Codex

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-codex-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: experimental-features = nix-command flakes
      - name: Check, update and build Codex
        id: update
        run: bash scripts/update-codex.sh
      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update Codex"
          title: "chore: update Codex"
          body: "Updated the Codex package metadata and verified the Nix build."
          branch: bump/codex-${{ github.run_id }}
      - name: Enable auto-merge
        if: steps.update.outputs.changed == 'true' && steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --auto --squash --delete-branch
